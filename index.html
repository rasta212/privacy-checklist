<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy & Online Security Checklist</title>
  <meta name="description" content="A practical privacy and online security checklist: accounts, phone, browser, VPN, email, and social media.">
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #2563eb;
      --done: #16a34a;
      --border: #d9e2ec;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --done: #4ade80;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header h1 { font-size: 1.7rem; margin: 0 0 8px; }
    header p { color: var(--muted); margin: 0 0 16px; }
    .progress-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .progress-text { font-weight: 600; margin-bottom: 8px; }
    .progress-bar {
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--done);
      transition: width 0.3s ease;
    }
    .reset {
      margin-top: 12px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
    }
    .reset:hover { color: var(--text); }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    section h2 { font-size: 1.15rem; margin: 0 0 12px; }
    label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      cursor: pointer;
    }
    label + label { border-top: 1px solid var(--border); }
    input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      accent-color: var(--done);
      flex-shrink: 0;
    }
    label.checked span { color: var(--muted); text-decoration: line-through; }
    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Privacy & Online Security Checklist</h1>
      <p>Tick what you already have set up. Your progress is saved in this browser.</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-text" id="progress-text">0 of 0 completed</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="reset" id="reset">Reset checklist</button>
    </div>

    <div id="sections"></div>

    <footer>
      <p>This material is for guidance only. App and system menus change with updates.</p>
      <p>More detailed guides: <a href="https://mysafeip.blogspot.com/">mysafeip.blogspot.com</a></p>
    </footer>
  </main>

  <script>
    const data = [
      {
        title: "1. Accounts and passwords",
        items: [
          "I use a different password for each important service (email, bank, social media).",
          "I use a password manager to store them.",
          "Two-factor authentication (2FA) is enabled on my main email account.",
          "Two-factor authentication is enabled on my bank account and social media accounts.",
          "I prefer an authenticator app or a physical security key over SMS, when the service allows it.",
          "Once a year I review which sessions and devices have access to my accounts and sign out of any I do not recognise.",
          "My recovery email and recovery phone number are up to date."
        ]
      },
      {
        title: "2. Phone",
        items: [
          "The operating system and apps are up to date.",
          "I use a passcode or biometrics to unlock my phone.",
          "I review which apps can access my location and switch to \"only while using the app\" where possible.",
          "I have reviewed microphone and camera permissions and removed the ones I do not need.",
          "I have turned off automatic connection to open Wi-Fi networks.",
          "I have uninstalled apps I no longer use.",
          "\"Find my device\" is enabled.",
          "I have backed up my important data."
        ]
      },
      {
        title: "3. Browser",
        items: [
          "My browser is up to date.",
          "I block third-party cookies or enable tracking protection.",
          "I have reviewed my installed extensions and removed any I do not recognise or use.",
          "I have enabled warnings before visiting sites with invalid certificates.",
          "I store passwords only in a trusted password manager."
        ]
      },
      {
        title: "4. Network and VPN",
        items: [
          "My router's admin password has been changed from the default.",
          "My router's firmware is up to date.",
          "My Wi-Fi network uses WPA2 or WPA3 encryption.",
          "If I use a VPN, I chose a provider with a no-logs policy verified by a third party or independent audits.",
          "If I use a VPN, I have tested the connection with a leak-detection tool and checked DNS, WebRTC, and IPv6.",
          "I have enabled the VPN's \"kill switch\" if the app offers it."
        ]
      },
      {
        title: "5. Email, messages, and calls",
        items: [
          "I do not click links in messages that create urgency (\"your account will be locked today\").",
          "Before logging in to a site from an email, I type the address myself or use a saved bookmark.",
          "I check the real sender address, not just the name shown.",
          "I never share verification codes with anyone, even if they say they are from my bank or a company.",
          "If I receive a suspicious call, I hang up and call the official number myself."
        ]
      },
      {
        title: "6. Social media",
        items: [
          "I have reviewed who can see my posts and personal information.",
          "I have turned off search by phone number or email, if the app allows it.",
          "I have removed tags from photos I do not want on my profile.",
          "I review the apps and websites connected to my account."
        ]
      },
      {
        title: "7. General habits",
        items: [
          "I avoid logging in to important accounts on public computers.",
          "I use my own charger or a charge-only adapter in public places.",
          "I check what information about me appears when I search my name.",
          "I review this checklist every three months."
        ]
      }
    ];

    const STORAGE_KEY = "privacy-checklist-state";
    let saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      saved = {};
    }

    const container = document.getElementById("sections");
    const allBoxes = [];

    data.forEach((section, si) => {
      const sec = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = section.title;
      sec.appendChild(h2);

      section.items.forEach((text, ii) => {
        const id = `${si}-${ii}`;
        const label = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.dataset.id = id;
        box.checked = !!saved[id];
        const span = document.createElement("span");
        span.textContent = text;
        label.appendChild(box);
        label.appendChild(span);
        label.classList.toggle("checked", box.checked);
        box.addEventListener("change", () => {
          label.classList.toggle("checked", box.checked);
          persist();
          updateProgress();
        });
        allBoxes.push(box);
        sec.appendChild(label);
      });

      container.appendChild(sec);
    });

    function persist() {
      const state = {};
      allBoxes.forEach(b => { if (b.checked) state[b.dataset.id] = true; });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        /* Storage may be blocked by the browser; the checklist still works. */
      }
    }

    function updateProgress() {
      const total = allBoxes.length;
      const done = allBoxes.filter(b => b.checked).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progress-text").textContent =
        `${done} of ${total} completed (${pct}%)`;
      document.getElementById("progress-fill").style.width = pct + "%";
    }

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Do you want to clear all checkboxes?")) return;
      allBoxes.forEach(b => {
        b.checked = false;
        b.closest("label").classList.remove("checked");
      });
      persist();
      updateProgress();
    });

    updateProgress();
  </script>
</body>
</html>
